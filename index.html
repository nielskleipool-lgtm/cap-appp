html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 8% 0%,rgba(116,143,255,.13),transparent 42%),radial-gradient(ellipse at 92% 18%,rgba(111,190,198,.12),transparent 38%),linear-gradient(145deg,#f5f6f8,#e9edf3 55%,#f7f8fa);background-attachment:fixed;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.25}h1{font-size:24px}h2{font-size:17px}h3{font-size:15px}
.shell{display:flex;min-height:100vh}
.side{width:208px;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;padding:18px 10px;background:rgba(255,255,255,.58);backdrop-filter:blur(28px) saturate(165%);-webkit-backdrop-filter:blur(28px) saturate(165%);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:19px;padding:4px 12px 16px;color:var(--pr2)}
.nv{display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--mut);padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.nv em{font-style:normal}.nv:hover{color:var(--ink)}.nv.on{background:var(--s2);color:var(--ink);box-shadow:inset 3px 0 0 var(--pr)}
main{flex:1;min-width:0;max-width:980px;margin:0 auto;padding:22px 20px 60px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.58));backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(35,48,75,.07),inset 0 1px 0 rgba(255,255,255,.9);border-radius:20px;padding:16px;margin-bottom:14px}
.hov{cursor:pointer;transition:transform .15s,border-color .15s}.hov:hover{transform:translateY(-2px);border-color:var(--pr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}.big{font-size:30px;line-height:1}.em{font-size:30px}
.late{color:var(--bad)}.dn{text-decoration:line-through;opacity:.6}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.cards .card{margin:0}

.btn{border:1px solid var(--ln);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);color:var(--ink);padding:8px 14px;border-radius:12px;cursor:pointer;font:inherit;min-height:38px}
.btn.p{background:linear-gradient(135deg,#8978ed,#6758c9);border-color:rgba(255,255,255,.2);color:#fff;font-weight:650;box-shadow:0 5px 18px rgba(111,94,210,.24)}.btn.t{background:#e8edff;border-color:#d7defb;color:#334baf;font-weight:600}.btn.g{background:none;border-color:transparent;color:var(--mut)}
.ic{border:0;background:none;color:var(--mut);cursor:pointer;width:30px;height:30px;border-radius:8px;font-size:14px;flex:none}.ic:hover{background:var(--s2);color:var(--ink)}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);white-space:nowrap}.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.76);backdrop-filter:blur(12px);border:1px solid rgba(35,48,75,.12);border-radius:12px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:-1px}
input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--pr);flex:none}input.log{width:84px;padding:5px 8px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.nd{border-top:1px solid var(--ln);padding:6px 0}
details>summary{cursor:pointer;font-weight:600;padding:2px 0}
dialog{border:1px solid var(--ln);border-radius:16px;padding:20px;width:min(480px,94vw);max-height:90vh;background:rgba(250,251,253,.96);backdrop-filter:blur(28px);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.6)}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps div{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:var(--s2);color:var(--mut)}.steps .on{background:var(--pr);color:#fff}
.choice{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px;border-radius:12px;background:var(--s2);border:2px solid var(--ln);color:var(--ink);font:inherit;cursor:pointer}.choice.on{border-color:var(--pr)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
.emo{display:flex;gap:4px;flex-wrap:wrap;max-height:90px;overflow:auto;margin-top:6px}.emo button{border:1px solid var(--ln);background:var(--bg);border-radius:8px;font-size:18px;cursor:pointer;padding:2px 6px}
.runbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--pr);border-radius:12px;padding:8px 12px;margin-bottom:14px}
.mono{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--s2);border:1px solid var(--ln);padding:10px 14px;border-radius:12px;z-index:30;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.empty{text-align:center;padding:36px 12px}.ses{border-top:1px solid var(--ln);padding:8px 0}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut)}svg{display:block;max-width:100%}
textarea.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:120px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--ln);border-radius:999px;background:var(--s2);font-size:12px;color:var(--mut)}
.note-item,.event-item{padding:10px 0;border-top:1px solid var(--ln)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-day{min-height:74px;padding:6px;border:1px solid var(--ln);border-radius:9px;background:var(--s1);font-size:12px;overflow:hidden}
.calendar-day.today{border-color:var(--pr);box-shadow:inset 0 0 0 1px var(--pr)}
.calendar-day .dot{display:block;margin-top:4px;padding:2px 4px;border-radius:5px;background:var(--s2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-card{background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(235,240,255,.82));backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:20px;box-shadow:0 16px 42px rgba(50,65,100,.10),inset 0 1px 0 #fff}
.week-board{display:grid;grid-template-columns:104px repeat(7,minmax(118px,1fr));gap:7px;overflow-x:auto;padding-bottom:6px}.week-label{display:flex;align-items:center;font-weight:650;color:var(--mut);font-size:13px}.day-top,.day-cell{background:rgba(255,255,255,.62);border:1px solid var(--ln);border-radius:14px;padding:9px;min-width:0}.day-top{text-align:center;font-weight:650}.day-top small{display:block;color:var(--mut);font-weight:400}.day-cell{min-height:100px}.day-head{font-weight:650;font-size:12px;margin-bottom:8px;display:none}.day-task{display:flex;align-items:center;gap:5px;margin:5px 0;color:var(--ink);font-size:12px}.day-task span{flex:1;min-width:0;overflow-wrap:anywhere}.day-task .ic{width:20px;height:20px}.day-cell .btn{padding:3px 5px;min-height:28px;font-size:11px}
@media print{
  body{background:#fff!important;color:#111!important}
  .side,.btn,.ic,.runbar,.toast,dialog{display:none!important}
  main{max-width:none!important;padding:0!important}
  .card,.rank-card{break-inside:avoid;box-shadow:none!important;background:#fff!important;border:1px solid #ddd!important}
  .shell{display:block!important}
  .event-item{break-inside:avoid}
  .week-board{overflow:visible!important;grid-template-columns:70px repeat(7,minmax(0,1fr))!important}
  .day-cell,.day-top{min-width:0!important;padding:4px!important}
  .bar{border:1px solid #bbb}
}
@media(max-width:800px){.shell{display:block}.side{position:fixed;inset:auto 0 0 0;width:100%;height:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;justify-content:space-around;padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln);z-index:20}.brand{display:none}.nv{flex-direction:column;gap:0;padding:4px 2px;font-size:10px;min-width:0}.nv em{white-space:nowrap;font-size:10px}.nv span{font-size:20px}.nv.on{box-shadow:none}main{padding:14px 12px 110px}.toast{bottom:96px}}

.crit-wrap{overflow-x:auto}.crit{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:660px}.crit th,.crit td{padding:8px 6px;text-align:center;background:rgba(255,255,255,.62)}.crit thead th{background:none;font-size:12px;color:var(--mut);font-weight:650}.crit thead small{display:block;font-weight:400}.crit thead th.tdy{color:var(--pr2)}.crit .crit-name{text-align:left;min-width:200px;border-radius:12px 0 0 12px;font-weight:400}.crit td:last-child{border-radius:0 12px 12px 0;font-weight:650}.crit td.tdy{background:rgba(89,111,232,.14)}.crit input.neg{accent-color:var(--bad)}
.px-card{--c1:#5b6275;--c2:#8a92a6;--c3:#fff;position:relative;overflow:hidden;margin:4px 4px 20px;padding:18px;color:#e8ecff;background:#171a2e linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/8px 8px;font-family:'Press Start 2P','Courier New',monospace;font-size:9px;line-height:1.7;image-rendering:pixelated;box-shadow:0 -4px #5a64a8,0 4px #0c0e1c,-4px 0 #5a64a8,4px 0 #0c0e1c}
.px-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.px-gem{position:relative;padding:6px 12px}.px-float{animation:flt 1.6s steps(4) infinite}.px-info{flex:1;min-width:170px}.px-lbl{color:#8e96c9}.px-name{font-size:17px;color:var(--c2);margin:6px 0;text-shadow:3px 3px #0c0e1c}.px-score{display:flex;align-items:center;gap:8px;color:#ffe066}.px-coin svg{animation:spin 1s steps(8) infinite;display:block}
.spk{position:absolute;width:6px;height:6px;background:var(--c3);animation:twk 1.2s steps(2) infinite}.s1{top:2px;left:6px}.s2{top:30%;right:0;animation-delay:.4s}.s3{bottom:12px;left:0;animation-delay:.8s}
.px-bar{display:grid;gap:2px;margin:16px 0 8px;padding:3px;background:#0c0e1c;border:3px solid #3b4270}.px-bar i{height:16px;background:#262b4f}.px-bar i.on{background:var(--c1);box-shadow:inset 0 5px rgba(255,255,255,.28);animation:pop .5s steps(3) both;animation-delay:calc(var(--i)*40ms)}
.px-next{color:#aab2e6;margin-bottom:12px}.px-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.px-stats div{background:#0c0e1c;border:3px solid #3b4270;padding:8px;text-align:center;color:#8e96c9;font-size:8px}.px-stats b{display:block;font-size:13px;color:#fff;margin-bottom:4px}
.px-btns{display:flex;gap:10px;flex-wrap:wrap}.px-btn{font:inherit;color:#fff;background:var(--c1);border:0;padding:10px 12px;cursor:pointer;box-shadow:0 -3px rgba(255,255,255,.3) inset,0 3px rgba(0,0,0,.35) inset,0 0 0 3px #0c0e1c;min-height:40px}.px-btn:hover{filter:brightness(1.15)}.px-btn:active{transform:translateY(2px)}
.px-h{font-size:11px;color:#ffe066;margin-bottom:12px}.px-ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.px-tile{background:#0c0e1c;border:3px solid #3b4270;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}.px-tile b{font-weight:400;color:#fff}.px-tile span{color:#8e96c9;font-size:8px}.px-tile em{font-style:normal;font-size:8px;color:#8e96c9}.px-tile.cur{border-color:var(--c2);animation:blk 1s steps(2) infinite}.px-tile.cur em{color:var(--c2)}.px-tile.got em{color:#4ade80}.px-tile.lock svg{filter:grayscale(1) brightness(.5)}.px-note{color:#8e96c9;margin:12px 0 0}
.px-up{text-align:center;color:#ffe066;font-size:12px;margin-bottom:12px;animation:blk .6s steps(2) infinite}.px-fall{position:absolute;top:-30px;animation:fall 2.2s steps(10) 2}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes twk{0%{opacity:0}50%{opacity:1}}@keyframes pop{0%{transform:scaleY(0);opacity:0}100%{transform:scaleY(1);opacity:1}}@keyframes spin{0%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(.35)}50%{transform:scaleX(.05)}}@keyframes blk{50%{opacity:.55}}@keyframes fall{to{transform:translateY(420px)}}
@media(prefers-reduced-motion:reduce){.px-card *{animation:none!important}}
@media print{.px-card{display:none}}

:root{--bg:#0f1224;--s1:#171a2e;--s2:#222750;--ln:#3b4270;--ink:#e8ecff;--mut:#9aa3d8;--pr:#8da0ff;--pr2:#ffe066;--ok:#4ade80;--bad:#ff6b81;--wr:#ffd166;color-scheme:dark}

function weekKey(d=today()){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}
const critDays=(id,k)=>(((S.critDays||{})[k||weekKey()]||{})[id])||[];
const critScore=(x)=>{const c=critDays(x.id).reduce((a,v)=>a+(v?1:0),0)/7;return x.polarity==='negative'?1-c:c};
function weekItemsNow(){return (S.weekItems||[]).filter(x=>x.active!==false)}
function weeklyMetrics(){
 const ws=P(weekKey()),we=addP(ws,6,'d'),items=weekItemsNow(),logs=S.weekLogs[weekKey()]||{};
 const criterion=items.length?items.reduce((a,x)=>a+critScore(x),0)/items.length:1;
 const tasks=[];
 const hw=(S.homework||[]).filter(x=>x.week===weekKey());
 const allTasks=[...tasks,...hw];const taskScore=allTasks.length?allTasks.filter(x=>x.done).length/allTasks.length:1;
 const active=S.goals.filter(g=>!g.arch);const projectScore=active.length?active.reduce((a,g)=>a+prog(g,today()),0)/active.length:1;
 const parts=[];if(items.length)parts.push([criterion,.4]);if(allTasks.length)parts.push([taskScore,.3]);if(active.length)parts.push([projectScore,.3]);
 const score=parts.length?Math.round(parts.reduce((a,x)=>a+x[0]*x[1],0)/parts.reduce((a,x)=>a+x[1],0)*100):0;
 return {score,criterion,taskScore,projectScore,items,tasks,hw,allTasks,logs,ws,we};
}
const RANKS=[

 {name:'Argent I',score:35,weeks:1},{name:'Argent II',score:40,weeks:1},{name:'Argent III',score:45,weeks:1},

function rankInfo(){
 const m=weeklyMetrics(),key=weekKey();let rec=(S.rankWeeks||[]).find(x=>x.week===key);
 if(!rec){rec={week:key,score:m.score};S.rankWeeks.push(rec)}else rec.score=m.score;
 save();
 const ordered=[...S.rankWeeks].sort((a,b)=>a.week.localeCompare(b.week));
 let index=Number.isInteger(S.player.rankIndex)?S.player.rankIndex:-1;
 const lastAdvance=S.player.rankLastAdvanceWeek||'';
 if(lastAdvance!==key&&index<RANKS.length-1){
  const next=RANKS[index+1],tail=ordered.slice(-next.weeks);
  const contiguous=tail.length===next.weeks&&tail.every((x,i)=>i===0||P(x.week)-P(tail[i-1].week)===7*D);
  if(contiguous&&tail.every(x=>x.score>=next.score)){index++;S.player.rankIndex=index;S.player.rankLastAdvanceWeek=key;save()}
 }
 const target=RANKS[Math.min(index+1,RANKS.length-1)];
 const tail=ordered.slice(-target.weeks);let streak=0;for(let i=tail.length-1;i>=0;i--){if(tail[i].score<target.score)break;if(i<tail.length-1&&P(tail[i+1].week)-P(tail[i].week)!==7*D)break;streak++}
 return {m,index,tier:index>=0?RANKS[index].name:'Non classé',next:target,streak,rankCount:RANKS.length};
}

function parse(txt){const root=[],st=[{d:-1,ch:root}];
 txt.split('\n').forEach(l=>{if(!l.trim())return;const m=l.match(/^([ \t]*)(?:[-*•]|\d+[.)])?\s*(.+)$/);if(!m)return;const d=Math.floor(m[1].replace(/\t/g,'  ').length/2);let t=m[2].trim(),est=0;const e=t.match(/\((\d+(?:[.,]\d+)?)\s*h\)\s*$/);if(e){est=parseFloat(e[1].replace(',','.'));t=t.replace(e[0],'').trim()}
  const n=N({title:t,est});while(st.length>1&&st.at(-1).d>=d)st.pop();st.at(-1).ch.push(n);st.push({d,ch:n.ch})});return root}

 else{const k=Math.round(+w.k)||0;if(k>=2){const part=Math.round(g.target/k*100)/100,span=g.end?(P(g.end)-P(g.start))/k:0;

function pTasks(){
 const ws=P(weekKey()),we=addP(ws,6,'d'),key=weekKey();
 const active=S.goals.filter(g=>!g.arch&&!isDone(g));
 const tasks=(S.tasks||[]).filter(x=>x.period==='week'&&x.week===key);
 const hw=(S.homework||[]).filter(x=>x.week===key);
 const plan=(S.dayPlan||[]).filter(x=>x.date>=key&&x.date<=ymd(we)&&x.kind==='do');
 const exceptions=(S.exceptionTasks||[]);
 const allGoalSteps=active.flatMap(g=>leaves(g.nodes).map(n=>({goal:g.name,gid:g.id,nid:n.id,title:n.title,est:n.est||0,due:n.due||'',done:n.status==='done'})));
 const goalSteps=allGoalSteps.filter(n=>!n.done);
 const openHw=hw.filter(x=>!x.done),openPlan=plan.filter(x=>!x.done);
 const allPersonal=[];
 const targetHours=active.reduce((a,g)=>a+(+g.wk||0),0),logged=secSince(ws);
 const remainingEst=active.reduce((a,g)=>a+leaves(g.nodes).filter(n=>n.status!=='done'&&n.est>0).reduce((b,n)=>b+n.est,0),0);
 const total=allPersonal.filter(x=>!x.done).length+openHw.length+openPlan.length+goalSteps.length;
 const completed=allPersonal.filter(x=>x.done).length+hw.filter(x=>x.done).length+plan.filter(x=>x.done).length+allGoalSteps.filter(x=>x.done).length;
 const all=allPersonal.length+hw.length+plan.length+allGoalSteps.length;
 const group=(title,arr,render)=>`<div class="card"><div class="row"><h2 class="sp">${title}</h2><span class="badge">${arr.length} restant(s)</span></div>${arr.map(render).join('')||'<p class="mut sm">Rien à faire ici 🎉</p>'}</div>`;
 return `<div class="row" style="margin-bottom:14px"><h1 class="sp">Ma semaine</h1><button class="btn" data-a="print">⎙ Imprimer</button></div>
 <div class="mut sm" style="margin-bottom:12px">${fd(ws)} – ${fd(we)}</div>
 <div class="grid" style="margin-bottom:14px">${tile('À terminer',total)}${tile('Terminées',completed)}${tile('Heures visées',num(targetHours)+' h')}${tile('Heures réalisées',hm(logged))}${tile('Temps estimé restant',remainingEst?num(remainingEst)+' h':'À estimer')}${tile('Avancement',all?Math.round(completed/all*100)+' %':'—')}</div>
 <div class="card"><div class="row"><div class="sp"><h2>Temps de la semaine</h2><div class="mut sm">${hm(logged)} réalisées${targetHours?' sur '+num(targetHours)+' h visées':''}</div></div><b>${targetHours?Math.round(logged/(targetHours*3600)*100)+' %':'—'}</b></div>${bar(targetHours?logged/(targetHours*3600):0,'#2dd4bf')}</div>
 
 ${group('Devoirs',openHw,x=>`<div class="event-item"><b>${esc(x.subject)} · ${esc(x.title)}</b><div class="mut sm">${x.due?'À rendre le '+fd(x.due):'Sans date limite'} · ${esc(x.priority||'Priorité normale')}</div></div>`)}
 ${group('Planning restant',openPlan,x=>`<div class="event-item"><b>${fd(x.date)} · ${esc(x.title)}</b></div>`)}
 ${group('Étapes de projets restantes',goalSteps,x=>`<div class="event-item row"><div class="sp"><b>${esc(x.goal)} · ${esc(x.title)}</b><div class="mut sm">${x.est?num(x.est)+' h estimées':'Durée à estimer'}${x.due?' · Échéance : '+fd(x.due):''}</div></div><button class="ic" data-a="open" data-g="${x.gid}" title="Ouvrir l’objectif">↗</button></div>`)}
 <div class="row"><button class="btn" data-a="nav" data-p="school">Devoirs →</button><button class="btn" data-a="nav" data-p="sess">Sessions →</button></div>`;
}

function parseLinks(t){return String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.split('|').map(z=>z.trim()),u=m.length>1?m[1]:m[0];return /^https?:\/\//i.test(u)?{l:m.length>1?m[0]:'',u}:null}).filter(Boolean)}
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,'<br>');
function hwDialog(x){const o=x||{subject:'',title:'',due:'',priority:'Normale',note:'',steps:[],links:[]};dlg(`<h2>${x?'Modifier':'Ajouter'} un devoir</h2><label>Matière</label><input name="subject" required value="${esc(o.subject)}" placeholder="Mathématiques"><label>Devoir à faire</label><input name="title" required value="${esc(o.title)}" placeholder="Exercices page 42"><div class="row"><div class="sp"><label>Date de rendu</label><input name="due" type="date" value="${o.due||''}"></div><div class="sp"><label>Priorité</label><select name="priority"><option ${o.priority==='Basse'?'selected':''}>Basse</option><option ${(!o.priority||o.priority==='Normale')?'selected':''}>Normale</option><option ${o.priority==='Haute'?'selected':''}>Haute</option></select></div></div><label>Étapes (une par ligne)</label><textarea name="steps" rows="4" placeholder="Lire le chapitre&#10;Faire les exercices&#10;Relire">${esc((o.steps||[]).map(z=>z.t).join('\n'))}</textarea><label>Liens (« Titre | https://… » ou juste l’URL, un par ligne)</label><textarea name="links" rows="2">${esc((o.links||[]).map(k=>k.l?k.l+' | '+k.u:k.u).join('\n'))}</textarea><label>Notes (les adresses https:// deviennent cliquables)</label><textarea name="note" rows="3">${esc(o.note||'')}</textarea>`,d=>{const old=(x&&x.steps)||[];const steps=String(d.steps||'').split('\n').map(t=>t.trim()).filter(Boolean).map(t=>{const f=old.find(z=>z.t===t);return{id:f?f.id:uid(),t,done:f?f.done:false}});const data={subject:d.subject,title:d.title,due:d.due,priority:d.priority,note:d.note||'',steps,links:parseLinks(d.links)};if(steps.length)data.done=steps.every(z=>z.done);if(x)Object.assign(x,data);else S.homework.push({id:uid(),week:weekKey(),done:false,...data})})}
const PG={home:pHome,goals:pGoals,goal:pGoal,new:pNew,sess:pSess,stats:pStats,set:pSet,notes:pNotes,agenda:pAgenda,rpg:pRpg,weekly:pWeekly,week:pWeek,tasks:pWeek,school:pSchool};
function render(){
 const nv=[['home','🏠','Accueil'],['goals','🎯','Objectifs'],['week','📋','Semaine'],['school','🎓','Devoirs'],['agenda','🗓️','Agenda'],['notes','📝','Notes'],['rpg','🏆','RPG'],['weekly','✨','Bilan'],['sess','⏱','Sessions'],['stats','📊','Stats'],['set','⚙️','Réglages']],pg=PG[U.page]?U.page:'home';
 const body=PG[pg]();
 $('#app').innerHTML=`<div class="shell"><nav class="side"><div class="brand"><span class="logo">${coin(2)}</span> Cap</div>${nv.map(n=>`<button class="nv ${pg===n[0]||((pg==='goal'||pg==='new')&&n[0]==='goals')?'on':''}" data-a="nav" data-p="${n[0]}"><span>${n[1]}</span><em>${n[2]}</em></button>`).join('')}${(()=>{const ix=Number.isInteger(S.player.rankIndex)?S.player.rankIndex:-1,nm=ix<0?'Non classé':RANKS[ix].name,t=TIER[tierKey(nm)];document.body.style.setProperty('--rk',t[2]);document.body.style.setProperty('--rk2',t[1]);return `<button class="side-rank" data-a="nav" data-p="rpg"><span class="px-float">${crystal(nm,3)}</span><span>${esc(nm)}</span></button>`})()}</nav><main>${runBar()}${body}</main></div>${U.toast?`<div class="toast"><span>${esc(U.toast.m)}</span>${U.toast.f?'<button type="button" class="btn p" data-a="undo">Annuler</button>':''}</div>`:''}`;
 {const m=$('main');if(m&&window._lp!==pg){m.classList.add('enter');window._lp=pg}const on=document.querySelector('.nv.on');if(on&&matchMedia('(max-width:800px)').matches)try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
 $('#app').querySelectorAll('button[data-a]').forEach(b=>{if(!b.hasAttribute('type'))b.type='button'});
}
setInterval(()=>{const c=$('#clock');if(c&&S.run)c.textContent=clk(runMs())},500);
setInterval(()=>{if(S.run)save()},5000);
render();
